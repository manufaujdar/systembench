[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systembench"
version = "0.1.1"
description = "End-to-end reliability benchmark framework for AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "SystemBench contributors"}]
keywords = ["ai", "benchmarking", "evaluation", "reliability", "observability"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
systembench = "systembench.cli:main"
systembench-web = "systembench.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
systembench = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
